spring.application.name=balance-auth
server.port=9000

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/authdb
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
spring.security.oauth2.authorizationserver.jwt.issuer=http://localhost:9000

# Logging
logging.level.org.springframework.security=INFO
logging.level.it.peluso.balanceauth=INFO

# CORS Configuration (for development)
spring.web.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*